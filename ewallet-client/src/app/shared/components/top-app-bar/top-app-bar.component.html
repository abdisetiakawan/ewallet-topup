<header class="bg-surface shadow-sm sticky top-0 z-50 w-full">
  <div class="flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop py-md max-w-[1280px] mx-auto">
    <!-- Brand -->
    <div class="flex items-center gap-sm cursor-pointer">
      <span class="material-symbols-outlined text-primary text-[28px]" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
      <span class="font-bold text-h2 text-primary tracking-tight">WalletPay</span>
    </div>

    <!-- Desktop Nav + Actions -->
    <div class="flex items-center gap-lg">
      <nav class="hidden md:flex gap-md" *ngIf="showNavLinks">
        <a class="px-4 py-2 rounded-lg transition-colors cursor-pointer"
           [class.text-primary]="activeNav === 'home'"
           [class.font-bold]="activeNav === 'home'"
           [class.border-b-2]="activeNav === 'home'"
           [class.border-primary]="activeNav === 'home'"
           [class.text-on-surface-variant]="activeNav !== 'home'"
           [class.hover:bg-surface-container-low]="activeNav !== 'home'">
          Home
        </a>
        <a class="px-4 py-2 rounded-lg transition-colors cursor-pointer"
           [class.text-primary]="activeNav === 'wallets'"
           [class.font-bold]="activeNav === 'wallets'"
           [class.border-b-2]="activeNav === 'wallets'"
           [class.border-primary]="activeNav === 'wallets'"
           [class.text-on-surface-variant]="activeNav !== 'wallets'"
           [class.hover:bg-surface-container-low]="activeNav !== 'wallets'">
          Wallets
        </a>
        <a class="px-4 py-2 rounded-lg transition-colors cursor-pointer"
           [class.text-primary]="activeNav === 'history'"
           [class.font-bold]="activeNav === 'history'"
           [class.border-b-2]="activeNav === 'history'"
           [class.border-primary]="activeNav === 'history'"
           [class.text-on-surface-variant]="activeNav !== 'history'"
           [class.hover:bg-surface-container-low]="activeNav !== 'history'">
          History
        </a>
      </nav>

      <div class="flex items-center gap-md">
        <span class="hidden lg:block text-on-surface-variant text-label-md">
          Balance: Rp {{ formattedBalance }}
        </span>
        <button type="button" aria-label="Notifikasi" class="p-2 rounded-full text-on-surface-variant hover:bg-surface-container-low transition-colors">
          <span class="material-symbols-outlined">notifications</span>
        </button>
        <button type="button" aria-label="Wallet" class="p-2 rounded-full text-on-surface-variant hover:bg-surface-container-low transition-colors">
          <span class="material-symbols-outlined">account_balance_wallet</span>
        </button>
        <div class="w-10 h-10 rounded-full bg-surface-container-highest border border-outline-variant overflow-hidden cursor-pointer flex items-center justify-center">
          <span class="material-symbols-outlined text-on-surface-variant text-[20px]">person</span>
        </div>
      </div>
    </div>
  </div>
</header>
