<div class="bg-background text-on-background min-h-screen pb-24">

  <!-- Brand header -->
  <app-top-app-bar />

  <!-- Main Content -->
  <main class="px-[16px] pt-[24px] flex flex-col gap-[32px] max-w-lg mx-auto">

    <!-- Profile Header Section -->
    @if (user$ | async; as user) {
    <section class="flex flex-col items-center gap-[16px]">
      <div class="relative">
        <div class="w-24 h-24 rounded-full overflow-hidden border-2 border-primary-container p-1">
          <div class="w-full h-full rounded-full bg-surface-container-highest flex items-center justify-center overflow-hidden">
            <span class="material-symbols-outlined text-on-surface-variant text-[40px]">person</span>
          </div>
        </div>
        <div class="absolute bottom-0 right-0 bg-primary text-on-primary rounded-full p-1 flex items-center justify-center border-2 border-surface">
          <span class="material-symbols-outlined text-[16px]"
                style="font-variation-settings: 'FILL' 1;">verified</span>
        </div>
      </div>
      <div class="text-center">
        <h2 class="text-[30px] leading-[38px] font-semibold text-on-surface">{{ user.name }}</h2>
        <div class="flex flex-col gap-[4px] mt-1">
          <span class="text-[14px] leading-[20px] text-on-surface-variant">{{ user.email }}</span>
          <span class="text-[14px] leading-[20px] font-medium tracking-[0.05em] text-outline">
            Member Since {{ user.createdAt | date:'MMM yyyy' }}
          </span>
        </div>
      </div>
    </section>
    }

    <!-- Account Settings Group -->
    <section>
      <h3 class="text-[14px] leading-[20px] font-medium tracking-[0.05em] text-primary mb-[8px] uppercase">Account Settings</h3>
      <div class="bg-surface-container-lowest border border-outline-variant rounded-xl overflow-hidden divide-y divide-outline-variant">
        <!-- Edit Profile -->
        <button
          routerLink="/account/edit-profile"
          class="w-full flex items-center justify-between p-[16px] hover:bg-surface-container-low transition-colors"
          aria-label="Edit Profile">
          <div class="flex items-center gap-[16px]">
            <span class="material-symbols-outlined text-on-secondary-container">person_edit</span>
            <span class="text-[16px] leading-[24px]">Edit Profile</span>
          </div>
          <span class="material-symbols-outlined text-outline">chevron_right</span>
        </button>
        <!-- Security -->
        <button
          class="w-full flex items-center justify-between p-[16px] hover:bg-surface-container-low transition-colors"
          aria-label="Security">
          <div class="flex items-center gap-[16px]">
            <span class="material-symbols-outlined text-on-secondary-container">security</span>
            <span class="text-[16px] leading-[24px]">Security (PIN &amp; Biometrics)</span>
          </div>
          <span class="material-symbols-outlined text-outline">chevron_right</span>
        </button>
      </div>
    </section>

    <!-- App Settings Group -->
    <section>
      <h3 class="text-[14px] leading-[20px] font-medium tracking-[0.05em] text-primary mb-[8px] uppercase">App Settings</h3>
      <div class="bg-surface-container-lowest border border-outline-variant rounded-xl overflow-hidden divide-y divide-outline-variant">
        <!-- Language -->
        <button
          class="w-full flex items-center justify-between p-[16px] hover:bg-surface-container-low transition-colors"
          aria-label="Language">
          <div class="flex items-center gap-[16px]">
            <span class="material-symbols-outlined text-on-secondary-container">translate</span>
            <div class="flex flex-col items-start">
              <span class="text-[16px] leading-[24px]">Language</span>
              <span class="text-[14px] leading-[20px] text-outline">Indonesian</span>
            </div>
          </div>
          <span class="material-symbols-outlined text-outline">chevron_right</span>
        </button>
        <!-- Dark Mode -->
        <div class="w-full flex items-center justify-between p-[16px]">
          <div class="flex items-center gap-[16px]">
            <span class="material-symbols-outlined text-on-secondary-container">dark_mode</span>
            <span class="text-[16px] leading-[24px]">Dark Mode</span>
          </div>
          <div class="w-12 h-6 bg-outline-variant rounded-full relative p-1 cursor-pointer">
            <div class="w-4 h-4 bg-surface rounded-full shadow-sm"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Support & Info Group -->
    <section>
      <h3 class="text-[14px] leading-[20px] font-medium tracking-[0.05em] text-primary mb-[8px] uppercase">Support &amp; Info</h3>
      <div class="bg-surface-container-lowest border border-outline-variant rounded-xl overflow-hidden divide-y divide-outline-variant">
        <button class="w-full flex items-center justify-between p-[16px] hover:bg-surface-container-low transition-colors" aria-label="Help Center">
          <div class="flex items-center gap-[16px]">
            <span class="material-symbols-outlined text-on-secondary-container">help</span>
            <span class="text-[16px] leading-[24px]">Help Center</span>
          </div>
          <span class="material-symbols-outlined text-outline">chevron_right</span>
        </button>
        <button class="w-full flex items-center justify-between p-[16px] hover:bg-surface-container-low transition-colors" aria-label="Privacy Policy">
          <div class="flex items-center gap-[16px]">
            <span class="material-symbols-outlined text-on-secondary-container">policy</span>
            <span class="text-[16px] leading-[24px]">Privacy Policy</span>
          </div>
          <span class="material-symbols-outlined text-outline">chevron_right</span>
        </button>
        <button class="w-full flex items-center justify-between p-[16px] hover:bg-surface-container-low transition-colors" aria-label="Terms of Service">
          <div class="flex items-center gap-[16px]">
            <span class="material-symbols-outlined text-on-secondary-container">description</span>
            <span class="text-[16px] leading-[24px]">Terms of Service</span>
          </div>
          <span class="material-symbols-outlined text-outline">chevron_right</span>
        </button>
        <button class="w-full flex items-center justify-between p-[16px] hover:bg-surface-container-low transition-colors" aria-label="About WalletPay">
          <div class="flex items-center gap-[16px]">
            <span class="material-symbols-outlined text-on-secondary-container">info</span>
            <span class="text-[16px] leading-[24px]">About WalletPay</span>
          </div>
          <span class="material-symbols-outlined text-outline">chevron_right</span>
        </button>
      </div>
    </section>

    <!-- Logout Button -->
    <section class="mt-[24px] mb-[32px]">
      <button
        type="button"
        (click)="logout()"
        class="w-full h-12 bg-surface border border-error text-error text-[24px] leading-[32px] font-semibold rounded-xl hover:bg-error-container transition-colors flex items-center justify-center gap-[8px]">
        <span class="material-symbols-outlined">logout</span>
        Logout
      </button>
      <p class="text-center text-[14px] leading-[20px] text-outline mt-[16px] italic">Version 2.4.1 (Build 120)</p>
    </section>

  </main>

  <!-- Bottom Nav Bar -->
  <app-bottom-nav-bar [activeNav]="'account'" />

</div>
