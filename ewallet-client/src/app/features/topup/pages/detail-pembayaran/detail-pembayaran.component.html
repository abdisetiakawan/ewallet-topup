<div class="bg-background text-on-background min-h-screen flex flex-col font-sans antialiased">



  <!-- Mobile header (transactional — back button only) -->
  <header class="bg-surface sticky top-0 z-50 flex items-center px-margin-mobile py-md shadow-sm">
    <button aria-label="Kembali" class="text-on-surface-variant hover:bg-surface-container-low transition-colors rounded-full p-2 mr-sm" (click)="goBack()">
      <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <h1 class="font-semibold text-h3 text-primary">Top-up {{ selectedWallet?.name }}</h1>
  </header>



  <!-- Mobile layout -->
  <main class="flex-grow pb-32">
    <!-- Destination -->
    <section class="px-margin-mobile pt-lg pb-md">
      <h2 class="text-label-md text-on-surface-variant mb-sm uppercase tracking-wider">Tujuan Top-up</h2>
      <div class="bg-surface-container-lowest p-md rounded-xl border border-outline-variant flex items-center shadow-sm">
        <div class="bg-primary-container text-on-primary-container w-12 h-12 rounded-full flex items-center justify-center mr-md shrink-0">
          <span class="material-symbols-outlined text-h3">account_balance_wallet</span>
        </div>
        <div>
          <p class="font-semibold text-h3 text-on-background">{{ selectedWallet?.name }} - {{ selectedWallet?.recipient }}</p>
          <p class="text-body-sm text-on-surface-variant">{{ selectedWallet?.phone }}</p>
        </div>
      </div>
    </section>

    <!-- Amount (mobile inline) -->
    <section class="px-margin-mobile py-md">
      <h2 class="text-label-md text-on-surface-variant mb-sm uppercase tracking-wider">Pilih Nominal</h2>
      <app-amount-selector variant="mobile" [selectedAmount]="selectedAmount" (amountChange)="onAmountChange($event)" />
    </section>

    <!-- Payment method -->
    <section class="px-margin-mobile py-md">
      <h2 class="text-label-md text-on-surface-variant mb-sm uppercase tracking-wider">Metode Pembayaran</h2>
      <div class="bg-surface-container-lowest p-md rounded-xl border border-outline-variant flex justify-between items-center shadow-sm cursor-pointer hover:bg-surface-container-low transition-colors">
        <div class="flex items-center">
          <div class="bg-secondary-container text-on-secondary-container w-10 h-10 rounded-full flex items-center justify-center mr-md">
            <span class="material-symbols-outlined">payments</span>
          </div>
          <div>
            <p class="font-semibold text-base text-on-background">Saldo Akun</p>
            <p class="text-body-sm text-on-surface-variant">Rp {{ format(accountBalance) }}</p>
          </div>
        </div>
        <span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
      </div>
    </section>
  </main>

  <!-- Mobile sticky summary -->
  <app-payment-summary
    [amount]="selectedAmount"
    [adminFee]="adminFee"
    variant="mobile"
    (pay)="onPay()" />
</div>
