<div class="bg-background text-on-background min-h-screen flex flex-col font-sans antialiased">

  <!-- Mobile header (simplified) -->
  <header class="bg-surface shadow-sm sticky top-0 z-50">
    <div class="flex justify-between items-center px-margin-mobile py-md">
      <div class="flex items-center gap-sm cursor-pointer">
        <span class="w-8 h-8 flex items-center justify-center text-primary">
          <span class="material-symbols-outlined text-[28px] leading-none" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
        </span>
        <span class="font-bold text-h2 leading-none text-primary tracking-tight">WalletPay</span>
      </div>
      <div class="flex items-center gap-md">
        <span class="text-label-md text-on-surface-variant hidden">Balance</span>
        <button class="w-10 h-10 rounded-full text-on-surface-variant hover:bg-surface-container-low transition-colors flex items-center justify-center">
          <span class="material-symbols-outlined leading-none">notifications</span>
        </button>
        <div class="w-8 h-8 rounded-full bg-surface-variant border border-outline-variant flex items-center justify-center cursor-pointer">
          <span class="material-symbols-outlined text-on-surface-variant text-[20px] leading-none">person</span>
        </div>
      </div>
    </div>
  </header>


  <main class="flex-grow px-margin-mobile pt-md pb-xl max-w-[600px] mx-auto w-full">
    <!-- Screen Header -->
    <div class="mb-lg">
      <h1 class="font-h3 text-h3 text-on-surface mb-xs">Tarik Saldo</h1>
      <p class="text-body-sm text-on-surface-variant">Pilih e-wallet tujuan untuk memindahkan dana Anda.</p>
    </div>

    <app-balance-card [balance]="balance" variant="mobile" />

    <section class="mb-md">
      <h2 class="font-semibold text-h3 text-on-surface mb-md">Pilih E-Wallet</h2>
      <div class="grid grid-cols-2 gap-md">
        @for (wallet of ewallets; track wallet.id) {
          <app-ewallet-card
            [wallet]="wallet"
            variant="mobile"
            [class.col-span-2]="wallet.featured"
            (selected)="onWalletSelected($event)"
          />
        }
      </div>
    </section>
  </main>

  <app-bottom-nav-bar activeNav="wallets" />
</div>
