<!-- Desktop: card wrapper with heading -->
@if (variant === 'desktop') {
  <section class="bg-surface-container-lowest border border-outline-variant rounded-xl p-lg shadow-sm">
    <h2 class="font-semibold text-h3 text-on-surface mb-md">Pilih Nominal</h2>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-sm mb-md">
      @for (option of presetAmounts; track option.value) {
        <button
          class="py-md px-sm rounded-lg border font-body-md focus:outline-none text-center transition-all"
          [class.border-2]="selectedAmount === option.value"
          [class.border-primary]="selectedAmount === option.value"
          [class.bg-primary-fixed]="selectedAmount === option.value"
          [class.text-on-primary-fixed]="selectedAmount === option.value"
          [class.font-semibold]="selectedAmount === option.value"
          [class.border-outline-variant]="selectedAmount !== option.value"
          [class.text-on-surface]="selectedAmount !== option.value"
          [class.hover:bg-surface-container-low]="selectedAmount !== option.value"
          [class.hover:border-primary]="selectedAmount !== option.value"
          (click)="selectPreset(option.value)">
          {{ option.label }}
        </button>
      }
    </div>
    <div class="mt-md">
      <label class="block text-label-md text-on-surface-variant mb-sm" for="manual-amount-desktop">
        Atau masukkan nominal manual
      </label>
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
          <span class="text-on-surface-variant text-body-lg">Rp</span>
        </div>
        <input
          id="manual-amount-desktop"
          type="text"
          [(ngModel)]="manualInput"
          (input)="onManualInput(manualInput)"
          placeholder="0"
          class="block w-full pl-xl pr-md py-md rounded-lg border border-outline-variant bg-surface focus:ring-2 focus:ring-primary focus:border-transparent text-on-surface text-body-lg font-semibold" />
      </div>
      <p class="text-body-sm text-on-surface-variant mt-xs">Min. top-up Rp 10.000</p>
    </div>
  </section>
}

<!-- Mobile: no card, no heading, flat layout -->
@if (variant === 'mobile') {
  <div class="grid grid-cols-2 gap-sm mb-md">
    @for (option of presetAmounts; track option.value) {
      <button
        class="bg-surface-container-lowest border border-outline-variant rounded-lg py-sm px-md text-center font-h3 text-h3 text-on-background hover:bg-primary-container hover:text-on-primary-container hover:border-primary-container transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2"
        [class.bg-primary-container]="selectedAmount === option.value"
        [class.text-on-primary-container]="selectedAmount === option.value"
        [class.border-primary-container]="selectedAmount === option.value"
        (click)="selectPreset(option.value)">
        {{ option.label }}
      </button>
    }
  </div>
  <div class="relative">
    <label class="sr-only" for="manual-amount-mobile">Nominal Manual</label>
    <div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
      <span class="text-body-lg text-on-surface-variant">Rp</span>
    </div>
    <input
      id="manual-amount-mobile"
      type="text"
      [(ngModel)]="manualInput"
      (input)="onManualInput(manualInput)"
      placeholder="Nominal lain"
      class="block w-full pl-12 pr-md py-sm bg-surface-container-lowest border border-outline-variant rounded-lg text-body-lg text-on-background focus:ring-2 focus:ring-primary focus:border-primary shadow-sm" />
  </div>
  <p class="text-body-sm text-outline mt-xs">Minimal top-up Rp 10.000</p>
}
