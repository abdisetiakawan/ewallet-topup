<div class="grid grid-cols-2 gap-sm mb-md">
  @for (option of presetAmounts; track option.value) {
    <button
      class="bg-surface-container-lowest border border-outline-variant rounded-lg py-sm px-md text-center font-h3 text-h3 text-on-background hover:bg-primary-container hover:text-on-primary-container hover:border-primary-container transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2"
      [class.bg-primary-container]="selectedAmount === option.value"
      [class.text-on-primary-container]="selectedAmount === option.value"
      [class.border-primary-container]="selectedAmount === option.value"
      (click)="selectPreset(option.value)">
      {{ option.label }}
    </button>
  }
</div>
<div class="relative">
  <label class="sr-only" for="manual-amount-mobile">Nominal Manual</label>
  <div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
    <span class="text-body-lg text-on-surface-variant">Rp</span>
  </div>
  <input
    id="manual-amount-mobile"
    type="text"
    [(ngModel)]="manualInput"
    (input)="onManualInput(manualInput)"
    placeholder="Nominal lain"
    class="block w-full pl-12 pr-md py-sm bg-surface-container-lowest border border-outline-variant rounded-lg text-body-lg text-on-background focus:ring-2 focus:ring-primary focus:border-primary shadow-sm" />
</div>
<p class="text-body-sm text-outline mt-xs">Minimal top-up Rp 10.000</p>
