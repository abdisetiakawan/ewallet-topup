<!-- Desktop grid card -->
@if (variant === 'desktop') {
  <div class="group flex flex-col items-center justify-center p-xl bg-surface border border-outline-variant rounded-xl cursor-pointer hover:shadow-[0_8px_24px_rgba(0,0,0,0.06)] hover:border-primary-container hover:-translate-y-1 transition-all duration-300"
       (click)="onSelect()" role="button" [attr.aria-label]="'Pilih ' + wallet.name">
    <div class="w-16 h-16 rounded-full flex items-center justify-center mb-md group-hover:bg-primary-fixed transition-colors"
         [style.background-color]="wallet.iconBgColor">
      <span class="material-symbols-outlined text-primary text-[32px]" style="font-variation-settings: 'FILL' 1">{{ wallet.icon }}</span>
    </div>
    <span class="text-label-md text-on-background group-hover:text-primary transition-colors">{{ wallet.name }}</span>
  </div>
}

<!-- Mobile compact card -->
@if (variant === 'mobile') {
  <button class="col-span-1 flex flex-col items-start p-md bg-surface-container-lowest border border-outline-variant rounded-xl hover:border-primary hover:bg-surface-container-low transition-all text-left w-full active:scale-[0.98]"
          (click)="onSelect()">
    <div class="w-10 h-10 mb-sm rounded-full flex items-center justify-center font-bold text-[16px]"
         [style.background-color]="wallet.iconBgColor"
         [style.color]="wallet.iconTextColor">
      <span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1">{{ wallet.icon }}</span>
    </div>
    <div class="text-label-md text-on-surface truncate w-full">{{ wallet.name }}</div>
    <div class="text-[12px] text-on-surface-variant mt-xs truncate w-full">{{ wallet.feeLabel }}</div>
  </button>
}
