# Development Profile Configuration

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/ewallet
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=60s

# Cookie Security
app.cookie.secure=false

# Mail (SMTP) — ganti dengan kredensial SMTP kamu
spring.mail.host=smtp.mailtrap.io
spring.mail.port=587
spring.mail.username=your-username
spring.mail.password=your-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Cache TTL
app.cache.merchants.ttl-hours=1
app.cache.wallet.ttl-minutes=30

# Logging
logging.level.root=INFO
logging.level.com.berijalan.ewallet=DEBUG
logging.level.org.hibernate.SQL=DEBUG
