# Development Profile Configuration

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/ewallet
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.datasource.hikari.pool-name=EwalletDevHikariPool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=60s

# Cookie Security
app.cookie.secure=false

# OpenAPI Documentation
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
app.docs.public=true

# Mail (SMTP) — ganti dengan kredensial SMTP kamu
spring.mail.host=smtp.mailtrap.io
spring.mail.port=587
spring.mail.username=your-username
spring.mail.password=your-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${APP_MAIL_FROM:no-reply@astrapay.local}

# Cache TTL
app.cache.merchants.ttl-hours=1
app.cache.wallet.ttl-minutes=30

# Logging
logging.level.root=INFO
logging.level.com.berijalan.ewallet=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.zaxxer.hikari=DEBUG
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId:-no-request}] [user:%X{userId:-anonymous}] [%X{httpMethod:-NA} %X{requestPath:-NA}] %logger{36} - %msg%n
logging.file.name=${LOG_FILE:logs/ewallet-server-dev.log}
logging.pattern.file=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId:-no-request}] [user:%X{userId:-anonymous}] [%X{httpMethod:-NA} %X{requestPath:-NA}] %logger{36} - %msg%n
logging.logback.rollingpolicy.file-name-pattern=${LOG_FILE_PATTERN:logs/ewallet-server-dev.%d{yyyy-MM-dd}.%i.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=250MB
