# Production Profile Configuration

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/ewallet
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=validate

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=60s

# Cookie Security (Enforce HTTPS in production)
app.cookie.secure=true

# Cache TTL
app.cache.merchants.ttl-hours=1
app.cache.wallet.ttl-minutes=30

# Logging
spring.jpa.show-sql=false
logging.level.root=WARN
logging.level.com.berijalan.ewallet=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId:-no-request}] [user:%X{userId:-anonymous}] [%X{httpMethod:-NA} %X{requestPath:-NA}] %logger{36} - %msg%n
