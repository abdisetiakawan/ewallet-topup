# Production Profile Configuration

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/ewallet
spring.datasource.username=postgres
spring.datasource.password=dewan123

spring.datasource.hikari.pool-name=EwalletProdHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.jpa.hibernate.ddl-auto=validate

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=60s

# Cookie Security (Enforce HTTPS in production)
app.cookie.secure=true

# Mail
app.mail.from=${APP_MAIL_FROM:no-reply@astrapay.local}

# OpenAPI Documentation
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
app.docs.public=false

# Cache TTL
app.cache.merchants.ttl-hours=1
app.cache.wallet.ttl-minutes=30

# Logging
spring.jpa.show-sql=false
logging.level.root=WARN
logging.level.com.berijalan.ewallet=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId:-no-request}] [user:%X{userId:-anonymous}] [%X{httpMethod:-NA} %X{requestPath:-NA}] %logger{36} - %msg%n
