openapi: 3.0.3
info:
  title: E-Wallet Topup API
  version: '1.0'
  description: |
    Semua endpoint menggunakan prefix `/api/...` dan format respons `BaseResponse`.
servers:
  - url: /api
    description: API prefix
tags:
  - name: Auth
  - name: Wallet
  - name: Transactions
paths:
  /auth/register:
    post:
      tags:
        - Auth
      summary: Registrasi pengguna baru
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: Budi
              email: budi@mail.com
              password: rahasia123
      responses:
        '200':
          description: Registrasi berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RegisterResponseData'
              example:
                requestId: req-123456
                status: true
                message: Registrasi berhasil
                data:
                  userId: 1
                  name: Budi
                  email: budi@mail.com
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /auth/login:
    post:
      tags:
        - Auth
      summary: Login dan mengembalikan JWT
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: budi@mail.com
              password: rahasia123
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResponseData'
              example:
                requestId: req-123457
                status: true
                message: Login berhasil
                data:
                  token: jwt-token
                  tokenType: Bearer
                  expiresIn: 3600
                  user:
                    userId: 1
                    name: Budi
                    email: budi@mail.com
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /wallet/balance:
    get:
      tags:
        - Wallet
      summary: Cek saldo user yang login
      operationId: getWalletBalance
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Saldo berhasil diambil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/WalletBalanceData'
              example:
                requestId: req-123458
                status: true
                message: Saldo berhasil diambil
                data:
                  balance: 150000
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /wallet/topup:
    post:
      tags:
        - Wallet
      summary: Top-up saldo
      operationId: topupWallet
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopupRequest'
            example:
              amount: 50000
              referenceId: INV-123-ABC
      responses:
        '200':
          description: Top-up berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TopupResponseData'
              example:
                requestId: req-123459
                status: true
                message: Top-up berhasil
                data:
                  transactionId: 10
                  newBalance: 150000
                  type: TOPUP
                  status: SUCCESS
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /transactions:
    get:
      tags:
        - Transactions
      summary: Riwayat transaksi dengan pagination dan filter status
      operationId: getTransactions
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Nomor halaman
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          description: Jumlah data per halaman
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
        - name: status
          in: query
          description: Filter status transaksi
          required: false
          schema:
            $ref: '#/components/schemas/TransactionStatus'
      responses:
        '200':
          description: Riwayat transaksi berhasil diambil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TransactionHistoryData'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /transactions/{id}:
    get:
      tags:
        - Transactions
      summary: Detail transaksi
      operationId: getTransactionDetail
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID transaksi
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Detail transaksi berhasil diambil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TransactionDetailData'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
  /transactions/pay:
    post:
      tags:
        - Transactions
      summary: Pembayaran ke merchant
      operationId: payToMerchant
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayRequest'
            example:
              merchantId: 2
              amount: 25000
              referenceId: PAY-MID-124
      responses:
        '200':
          description: Pembayaran berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PayResponseData'
              example:
                requestId: req-123460
                status: true
                message: Pembayaran berhasil
                data:
                  transactionId: 11
                  newBalance: 125000
                  merchantName: Toko Buku
                  status: SUCCESS
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    ErrorResponse:
      description: Error response dengan format BaseResponse
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BaseResponse'
          example:
            requestId: req-123499
            status: false
            message: Saldo tidak mencukupi
            data: null
  schemas:
    BaseResponse:
      type: object
      required:
        - requestId
        - status
        - message
        - data
      properties:
        requestId:
          type: string
          description: Unique request identifier
          example: req-123456
        status:
          type: boolean
          description: Status hasil request
          example: true
        message:
          type: string
          description: Pesan hasil request
          example: Registrasi berhasil
        data:
          nullable: true
          description: Payload data, null jika gagal
    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          example: Budi
        email:
          type: string
          format: email
          example: budi@mail.com
        password:
          type: string
          format: password
          example: rahasia123
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: budi@mail.com
        password:
          type: string
          format: password
          example: rahasia123
    UserSummary:
      type: object
      required:
        - userId
        - name
        - email
      properties:
        userId:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Budi
        email:
          type: string
          format: email
          example: budi@mail.com
    RegisterResponseData:
      $ref: '#/components/schemas/UserSummary'
    LoginResponseData:
      type: object
      required:
        - token
        - tokenType
        - expiresIn
        - user
      properties:
        token:
          type: string
          example: jwt-token
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          example: 3600
        user:
          $ref: '#/components/schemas/UserSummary'
    WalletBalanceData:
      type: object
      required:
        - balance
      properties:
        balance:
          type: integer
          format: int64
          example: 150000
    TopupRequest:
      type: object
      required:
        - amount
        - referenceId
      properties:
        amount:
          type: integer
          format: int64
          minimum: 1
          example: 50000
        referenceId:
          type: string
          description: Harus unik
          example: INV-123-ABC
    PayRequest:
      type: object
      required:
        - merchantId
        - amount
        - referenceId
      properties:
        merchantId:
          type: integer
          format: int64
          example: 2
        amount:
          type: integer
          format: int64
          minimum: 1
          example: 25000
        referenceId:
          type: string
          description: Harus unik
          example: PAY-MID-124
    TopupResponseData:
      type: object
      required:
        - transactionId
        - newBalance
        - type
        - status
      properties:
        transactionId:
          type: integer
          format: int64
          example: 10
        newBalance:
          type: integer
          format: int64
          example: 150000
        type:
          $ref: '#/components/schemas/TransactionType'
        status:
          $ref: '#/components/schemas/TransactionStatus'
    PayResponseData:
      type: object
      required:
        - transactionId
        - newBalance
        - merchantName
        - status
      properties:
        transactionId:
          type: integer
          format: int64
          example: 11
        newBalance:
          type: integer
          format: int64
          example: 125000
        merchantName:
          type: string
          example: Toko Buku
        status:
          $ref: '#/components/schemas/TransactionStatus'
    TransactionHistoryData:
      type: object
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/TransactionItem'
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 10
        totalElements:
          type: integer
          format: int64
          example: 1
        totalPages:
          type: integer
          example: 1
    TransactionItem:
      type: object
      required:
        - transactionId
        - referenceId
        - amount
        - type
        - status
      properties:
        transactionId:
          type: integer
          format: int64
          example: 11
        referenceId:
          type: string
          example: PAY-MID-124
        amount:
          type: integer
          format: int64
          example: 25000
        type:
          $ref: '#/components/schemas/TransactionType'
        status:
          $ref: '#/components/schemas/TransactionStatus'
        merchantName:
          type: string
          nullable: true
          example: Toko Buku
        createdAt:
          type: string
          format: date-time
          example: '2026-05-06T11:00:00+07:00'
    TransactionDetailData:
      allOf:
        - $ref: '#/components/schemas/TransactionItem'
        - type: object
          required:
            - baseAmount
            - taxAmount
            - balanceBefore
            - balanceAfter
            - taxDetails
          properties:
            baseAmount:
              type: integer
              format: int64
              example: 100000
            taxAmount:
              type: integer
              format: int64
              example: 2500
            balanceBefore:
              type: integer
              format: int64
              example: 200000
            balanceAfter:
              type: integer
              format: int64
              example: 97500
            description:
              type: string
              nullable: true
              example: Top-up Gopay
            taxDetails:
              type: array
              items:
                $ref: '#/components/schemas/TransactionTaxDetail'
    TransactionTaxDetail:
      type: object
      required:
        - taxName
        - taxCategory
        - valueType
        - taxValue
        - calculatedAmount
      properties:
        taxName:
          type: string
          example: Service Fee
        taxCategory:
          type: string
          example: SERVICE_FEE
        valueType:
          type: string
          example: PERCENTAGE
        taxValue:
          type: number
          example: 1.5000
        calculatedAmount:
          type: integer
          format: int64
          example: 1500
    TransactionType:
      type: string
      enum:
        - TOPUP
        - PAYMENT
    TransactionStatus:
      type: string
      enum:
        - SUCCESS
        - FAILED
        - PENDING
